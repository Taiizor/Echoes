version: '3.8'

services:
  # Production Service
  app:
    container_name: echoes
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4578:4578"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    networks:
      - echoes-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4578/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (optional - for production with SSL)
  nginx:
    image: nginx:alpine
    container_name: echoes-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - echoes-network
    profiles:
      - with-nginx
    restart: unless-stopped

networks:
  echoes-network:
    driver: bridge

volumes:
  node_modules:
  next_cache:
